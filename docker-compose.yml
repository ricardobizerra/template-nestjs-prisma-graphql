services:
  postgres:
    container_name: ${APP_NAME}-postgres
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    command: ["postgres", "-p", "${POSTGRES_PORT}", "-c", "log_statement=all"]
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -p ${POSTGRES_PORT}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend

  redis:
    container_name: ${APP_NAME}-redis
    image: redis:7-alpine
    restart: unless-stopped
    env_file:
      - .env
    command:
      - /bin/sh
      - -c
      - exec redis-server --requirepass "$${REDIS_PASSWORD:?REDIS_PASSWORD variable is not set}" --port $${REDIS_PORT:-6379}
    volumes:
      - redis:/data
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "-p", "${REDIS_PORT}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - backend

  api:
    container_name: ${APP_NAME}-api
    build:
      dockerfile: Dockerfile
      context: .
      target: ${DEVELOPMENT_TYPE}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    env_file:
      - .env
    ports:
      - "${PORT}:3333"
      - "9229:9229" # Node.js debug port
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres:
  redis:
  node_modules: